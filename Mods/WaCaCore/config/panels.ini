; WaCa Core - panels on the HUD for any mod (WaCa.HudPanel): copies of the game's quest panel, stacked under it.
;   Below: the first panel's distance under the game's quest panel (HUD units, 3840 x 2160); Step: between panels;
;   Right: sideways. On = 0: no panels.
;   More panels than fit: they are scaled down together (to 60% at least - smaller can't be read); the ones that
;   still don't fit wait (the last in their order) until there is room. Bottom: the margin kept free above the foot.
[Panels]
On = 1
Below = 760
Step = 480
Right = 0
Bottom = 140

[QuestTab]
; a tab after Main Quests / Side Quests in the pause menu's Quest page, showing the panels above (Clan Life's day):
; TriggerR past Side Quests or a click opens it. On = 0: no tab. Title: its name
On = 1
Title = Clan
; DetailDown: how far the page's detail panel moves down (its tab row is longer by one tab)
DetailDown = 120
